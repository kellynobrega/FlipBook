<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #flipbook-container {
      width: 80%;
      max-width: 900px;
      background-color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border-radius: 15px;
      padding: 20px;
      position: relative;
    }

    .flipbook {
      width: 100%;
      height: 600px;
      position: relative;
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    .page {
      background-color: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: 10px;
    }

    #flipbook-controls {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    #flipbook-controls button {
      background-color: #1da57a;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    #flipbook-controls button:hover {
      background-color: #17a26b;
    }

    #flipbook-controls button:active {
      background-color: #148b5a;
    }

    #cover-preview {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      background-color: #f7f7f7;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #cover-preview canvas {
      width: 100px;
      height: auto;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/jquery.turn.min.css">
</head>
<body>

  <div id="flipbook-container">
    <!-- Pré-visualização da capa -->
    <div id="cover-preview">
      <canvas id="cover-canvas"></canvas>
    </div>

    <div class="flipbook">
      <!-- As páginas do flipbook serão renderizadas aqui -->
    </div>

    <!-- Controles -->
    <div id="flipbook-controls">
      <button id="zoom-in">Zoom +</button>
      <button id="zoom-out">Zoom -</button>
      <button id="fullscreen">Tela Cheia</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/jquery.turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.8.162/pdf.min.js"></script>
  <script>
    $(document).ready(function() {
      const flipbook = $(".flipbook");
      const pdfData = localStorage.getItem("pdfData");

      if (!pdfData) {
        alert("Nenhum PDF foi carregado para visualização.");
        return;
      }

      // Carregar o PDF do localStorage
      const loadingTask = pdfjsLib.getDocument(pdfData);
      loadingTask.promise.then(function(pdf) {
        // Renderizar a capa (primeira página) para a pré-visualização
        pdf.getPage(1).then(function(page) {
          const scale = 0.5;  // Ajuste de zoom para pré-visualização
          const viewport = page.getViewport({ scale });
          const canvas = document.getElementById('cover-canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          page.render(renderContext).promise.then(function() {
            console.log("Capa do PDF renderizada.");
          });
        });

        // Carregar as outras páginas no flipbook (começando da segunda página)
        for (let i = 2; i <= pdf.numPages; i++) {
          pdf.getPage(i).then(function(page) {
            const scale = 1.5;  // Zoom para as páginas do flipbook
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            const renderContext = {
              canvasContext: context,
              viewport: viewport
            };
            page.render(renderContext).promise.then(function() {
              const pageDiv = $('<div class="page"></div>').append(canvas);
              flipbook.append(pageDiv);
              if (i === pdf.numPages) {
                flipbook.turn({
                  width: 900,
                  height: 600,
                  autoCenter: true,
                  display: 'double',
                  acceleration: true
                });
              }
            });
          });
        }
      }).catch(function(error) {
        alert("Erro ao carregar o PDF: " + error.message);
      });

      // Função de Zoom
      let zoomLevel = 1.5;
      $('#zoom-in').click(function() {
        zoomLevel += 0.1;
        renderPDF();
      });
      $('#zoom-out').click(function() {
        if (zoomLevel > 1) {
          zoomLevel -= 0.1;
          renderPDF();
        }
      });

      // Função de tela cheia
      $('#fullscreen').click(function() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      function renderPDF() {
        // Re-renderizar as páginas com o novo nível de zoom
        pdfjsLib.getDocument(pdfData).promise.then(function(pdf) {
          pdf.getPage(1).then(function(page) {
            const viewport = page.getViewport({ scale: zoomLevel });
            const canvas = document.getElementById('cover-canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            const renderContext = {
              canvasContext: context,
              viewport: viewport
            };
            page.render(renderContext).promise.then(function() {
              console.log("Página renderizada com novo zoom.");
            });
          });
        });
      }
    });
  </script>
</body>
</html>
