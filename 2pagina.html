<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customizar Flipbook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 1000px;
      width: 100%;
      padding: 40px;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    #pdf-preview {
      margin-top: 30px;
      width: 100%;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      border-radius: 8px;
      border: 1px solid #ddd;
      position: relative;
    }

    #pdf-preview img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    .pdf-actions {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      gap: 10px;
    }

    #pdf-preview:hover .pdf-actions {
      display: flex;
    }

    .pdf-actions button {
      background-color: #1da57a;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .pdf-actions button:hover {
      background-color: #159955;
    }

  </style>
</head>
<body>

<div id="container">
  <h1>Flipbook Personalizado</h1>

  <!-- Visualização do PDF -->
  <div id="pdf-preview">
    <img id="preview-image" src="" alt="Imagem de exemplo" />
    <div class="pdf-actions">
      <button onclick="viewPDF()">Visualizar</button>
      <button onclick="editPDF()">Editar</button>
      <button onclick="deletePDF()">Deletar</button>
    </div>
  </div>
</div>

<script>
  // Pega a imagem do PDF carregada na primeira página
  const previewImage = document.getElementById('preview-image');
  const selectedPDF = localStorage.getItem('selectedPDF');

  if (selectedPDF) {
    previewImage.src = selectedPDF; // Exibe o PDF escolhido na primeira página
  }

  // Função para visualizar o PDF
  function viewPDF() {
    window.open(previewImage.src, '_blank'); // Abre o PDF em uma nova aba
  }

  // Função para editar o PDF (por enquanto não faz nada)
  function editPDF() {
    alert('Funcionalidade de edição ainda não implementada!');
    // Implementar a edição aqui
  }

  // Função para deletar o PDF
  function deletePDF() {
    const confirmDelete = confirm('Tem certeza que deseja deletar o PDF?');
    if (confirmDelete) {
      // Limpa a visualização
      previewImage.src = "";
      localStorage.removeItem('selectedPDF');
      alert('PDF deletado!');
      window.location.href = 'index.html'; // Redireciona para a primeira página para carregar outro PDF
    }
  }
</script>

</body>
</html>
